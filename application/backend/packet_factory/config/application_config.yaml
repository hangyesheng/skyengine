config:
  env_type: simulation

  simulation:
    env_name: packet_factory
    # 环境运行模式配置
    # mode 由 config/agents/ 下的 Agent 配置文件提供（drl | optimization）
    #   drl: 事件驱动强化学习模式
    #   optimization: 传统优化调度模式

    # ui_mode / task_mode 全局控制（2x2 模式矩阵）
    ui_mode: frontend     # frontend | backend  — 是否启用可视化
    task_mode: inference  # training | inference  — 是否进行学习更新

    # map_config:
    #   由配置文件生成

    # job_config:
    #   由配置文件生成

    # event_config:
    #   由配置文件生成

    # agent 配置由 config/agents/ 下的独立文件提供
    # 通过 auto_train_loop.py --agent 或 run_benchmark.py --agents 按需加载
    # 后端启动时通过 specific_config['agent'] 合并到此处
    agent: {}

    callback:
      map_callback:
        graph_loader:
          name: backend_callback.MapLoader
          args: [ ]
        visualizer:
          name: backend_callback.Visualizer
          args: [ 3 ]    #  fps
        event_queue:
          name: base_callback.EventQueue
          args: [ ]
      agent_callback:
        before_decision:
          name: base_callback.BeforeDecision
          args: [ ]
        after_decision:
          name: base_callback.AfterDecision
          args: [ ]
