# GraphDPAgent 配置
# 对应 executor/packet_factory/packet_factory/Agent/GraphDPAgent.py

agent_name: packet_factory.GraphDPAgent
name: GraphDPAgent
id: 1
ui_mode: backend
task_mode: training
model_path: ./training_logs/models/GraphDPAgent/agent_model.pt
time_limit_seconds: 30
fallback_enabled: true

# 计算设备
device: cuda

# GNN 编码器
hidden_dim: 64

# DP 公共参数
gamma: 0.99

# 学习率
lr_gnn: 0.0001
lr_trans: 0.001
lr_value: 0.001

# DP 特有参数
alpha: 0.01
rewalk_iters: 3

# 训练参数
buffer_capacity: 5000
batch_size: 64
epsilon: 1.0
epsilon_decay: 0.995
epsilon_min: 0.01

# 其他
allow_agv_reassignment: false
